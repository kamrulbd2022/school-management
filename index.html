<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>শহীদ জমশেদ আলী ইসলামিক একাডেমি - স্কুল ম্যানেজমেন্ট সফটওয়্যার</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --secondary: #0f172a;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #334155;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 12px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    * { box-sizing: border-box; }
    body { font-family: 'Plus Jakarta Sans', 'Noto Sans Bengali', 'Kalpurush', 'SolaimanLipi', sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; }
  </style>
</head>
<body>

  <!-- অ্যাডমিন লগইন ফর্ম -->
  <div id="admin-login-section" style="padding: 20px; background: #ffffff; margin: 30px auto; max-width: 400px; border-radius: 12px; box-shadow: var(--shadow); text-align: center;">
    <h3 style="color: var(--secondary); margin-bottom: 20px;">অ্যাডমিন লগইন</h3>
    <input type="email" id="email" placeholder="ইমেইল দিন" style="width: 100%; padding: 10px; margin-bottom: 12px; border: 1px solid var(--border-color); border-radius: 6px;"><br>
    <input type="password" id="password" placeholder="পাসওয়ার্ড দিন" style="width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); border-radius: 6px;"><br>
    <button id="login-btn" style="width: 100%; padding: 10px; background: var(--primary); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer;">লগইন করুন</button>
    <button id="logout-btn" style="width: 100%; padding: 10px; background: var(--danger); color: white; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; display: none;">লগআউট করুন</button>
  </div>

  <!-- Firebase স্ক্রিপ্ট এবং লগইন লজিক -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBpa5vJJxz-w31bXgsKU_E0_bZzKLccUXk",
      authDomain: "school-magmagnaent.firebaseapp.com",
      projectId: "school-magmagnaent",
      storageBucket: "school-magmagnaent.firebasestorage.app",
      messagingSenderId: "420484245124",
      appId: "1:420484245124:web:6899e1dfcce2badf6e44d1",
      measurementId: "G-9V5NZQ9Z9P"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const loginBtn = document.getElementById('login-btn');
    const logoutBtn = document.getElementById('logout-btn');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');

    // লগইন করার ফাংশন
    loginBtn.addEventListener('click', () => {
      const email = emailInput.value;
      const password = passwordInput.value;

      signInWithEmailAndPassword(auth, email, password)
        .then((userCredential) => {
          alert('সফলভাবে লগইন হয়েছে!');
        })
        .catch((error) => {
          alert('লগইন ব্যর্থ হয়েছে: ' + error.message);
        });
    });

    // লগআউট করার ফাংশন
    logoutBtn.addEventListener('click', () => {
      signOut(auth).then(() => {
        alert('লগআউট করা হয়েছে!');
      });
    });

    // ব্যবহারকারী লগইন করা আছে কিনা তা চেক করা
    onAuthStateChanged(auth, (user) => {
      if (user) {
        loginBtn.style.display = 'none';
        emailInput.style.display = 'none';
        passwordInput.style.display = 'none';
        logoutBtn.style.display = 'inline-block';
        console.log('অ্যাডমিন লগইন অবস্থায় আছেন');
      } else {
        loginBtn.style.display = 'inline-block';
        emailInput.style.display = 'inline-block';
        passwordInput.style.display = 'inline-block';
        logoutBtn.style.display = 'none';
        console.log('কেউ লগইন করা নেই');
      }
    });
  </script>
</body>
</html>
